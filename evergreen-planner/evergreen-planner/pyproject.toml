[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evergreen-planner"
version = "0.1.0"
description = "Evergreen computer-movement planning: campus graph, inventory, routing, grouping."
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "pandas>=2.1", "streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]
